# Graphics driver page. Mesa (AMD, Intel, older NVIDIA via nouveau) is always
# installed; the NVIDIA driver is a separate package, as on Arch.
---
mode: required
method: legacy
labels:
    step: "Graphics"
default: mesa
items:
    - id: mesa
      name: "Open-source drivers (Mesa)"
      description: "For AMD and Intel graphics, virtual machines, and NVIDIA cards older than the GeForce GTX 16 series (through nouveau)."
      screenshot: "/usr/share/icons/breeze/devices/64/video-display.svg"
    - id: nvidia
      name: "NVIDIA driver"
      description: "NVIDIA's driver with its open kernel modules, for GeForce GTX 16 / RTX 20 series and newer. Choose this for an NVIDIA card from the last several years."
      screenshot: "/usr/share/icons/breeze/devices/64/video-display.svg"
