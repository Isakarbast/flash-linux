# Services the stage scripts enabled. The login screen exists only with a
# desktop: SDDM for KDE, LightDM for the others.
---
initdDir: /etc/init.d
runlevelsDir: /etc/runlevels
services:
    - name: dbus
      runlevel: default
    - name: elogind
      runlevel: default
    - name: NetworkManager
      runlevel: default
    - name: sddm
      runlevel: default
      mandatory: false
    - name: lightdm
      runlevel: default
      mandatory: false
disable: []
