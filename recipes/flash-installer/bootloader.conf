# GRUB in EFI/flash. No fallback copy in EFI/BOOT, so another system's
# fallback loader on a shared EFI partition is left alone.
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
kernelParams: [ ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "flash"
installEFIFallback: false
installHybridGRUB: false
