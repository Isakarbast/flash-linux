---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: true
      system: true
    - name: audio
      must_exist: true
      system: true
    - name: video
      must_exist: true
      system: true
    - name: input
      must_exist: true
      system: true
    - name: render
      must_exist: true
      system: true
    - name: kvm
      must_exist: true
      system: true
# sudo is already set up for the wheel group.
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: true
displayAutologin: false
doAutologin: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "flash-${cpu}"
