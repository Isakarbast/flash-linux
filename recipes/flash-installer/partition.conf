# UEFI only, ext4 by default. No encryption or LVM: installed systems boot
# without an initramfs.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "xfs", "btrfs" ]
enableLuksAutomatedPartitioning: false
essentialMounts: [ "live-*" ]
lvm:
    enable: false
