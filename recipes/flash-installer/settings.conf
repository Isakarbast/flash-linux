# Calamares settings for installing Flash Linux from the live ISO.
# The packages come from the repository on the ISO (/run/live/medium/repo),
# installed with fpm; nothing is downloaded.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     desktop
  module: packagechooser
  config: packagechooser-desktop.conf
- id:     driver
  module: packagechooser
  config: packagechooser-driver.conf
- id:     extras
  module: packagechooser
  config: packagechooser-extras.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@desktop
  - packagechooser@driver
  - packagechooser@extras
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - fpminstall
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - services-openrc
  - flashcfg
  - grubcfg
  - bootloader
  - flashefi
  - umount
- show:
  - finished

branding: flash
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
