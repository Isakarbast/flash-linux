# Desktop page: each id is a package group fpminstall installs.
---
mode: required
method: legacy
labels:
    step: "Desktop"
default: flash-kde
items:
    - id: flash-kde
      name: "KDE Plasma"
      description: "KDE Plasma 6 on Wayland, with Dolphin, kitty and Firefox."
      screenshot: "/usr/share/plasma/look-and-feel/org.kde.breeze.desktop/contents/previews/fullscreenpreview.jpg"
    - id: flash-xfce
      name: "Xfce"
      description: "A light, traditional desktop (X11) with Thunar, xfce4-terminal and Firefox. Good on older computers."
      screenshot: "/usr/share/flash-installer/preview-xfce.jpg"
    - id: flash-cinnamon
      name: "Cinnamon"
      description: "Linux Mint's desktop (X11): a familiar layout with a start menu and taskbar, with Nemo, kitty and Firefox."
      screenshot: "/usr/share/flash-installer/preview-cinnamon.jpg"
    - id: flash-mate
      name: "MATE"
      description: "The classic GNOME 2 style desktop (X11) with Caja, MATE Terminal and Firefox."
      screenshot: "/usr/share/flash-installer/preview-mate.jpg"
    - id: flash-hyprland
      name: "Hyprland"
      description: "A tiling Wayland compositor with animations, with Waybar, fuzzel, kitty and Firefox. Keyboard driven: Super+Q opens a terminal."
      screenshot: "/usr/share/flash-installer/preview-hyprland.jpg"
    - id: flash-sway
      name: "Sway"
      description: "An i3-style tiling Wayland compositor, with fuzzel, kitty and Firefox. Keyboard driven: Super+Enter opens a terminal."
      screenshot: "/usr/share/flash-installer/preview-sway.jpg"
    - id: flash-mango
      name: "MangoWC"
      description: "A fast, animated tiling Wayland compositor (dwl-style), with Waybar, fuzzel, kitty and Firefox. Keyboard driven: Alt+Enter opens a terminal."
      screenshot: "/usr/share/flash-installer/preview-mango.jpg"
    - id: ""
      name: "No desktop"
      description: "A text console only. You can install a desktop later with fpm."
      screenshot: "/usr/share/icons/breeze/apps/64/utilities-terminal.svg"
