# Privacy defaults. Override any of these in /etc/NetworkManager/conf.d/.

[connectivity]
# No periodic "am I online?" requests to a remote server.
# Side effect: hotel/airport login pages won't pop up; open any http:// site instead.
enabled=false

[device]
# Random MAC address while scanning for Wi-Fi networks.
wifi.scan-rand-mac-address=yes

[connection]
# Wi-Fi: a new random MAC address for every connection.
wifi.cloned-mac-address=random
# Ethernet: a different MAC per network, stable on each (keeps DHCP leases sane).
ethernet.cloned-mac-address=stable
# IPv6: temporary addresses, so the address doesn't identify this machine.
ipv6.ip6-privacy=2
# Don't announce or look up this machine's name on the local network.
connection.mdns=0
connection.llmnr=0
