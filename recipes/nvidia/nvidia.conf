# The proprietary driver replaces the open-source ones.
blacklist nouveau
blacklist nova_core
blacklist nova_drm

# Load the rest of the driver after the main module.
softdep nvidia post: nvidia-uvm nvidia-drm

# Kernel modesetting and a proper console framebuffer (needed for Wayland).
options nvidia_drm modeset=1 fbdev=1

# Temporary files in /var/tmp rather than the tmpfs /tmp.
options nvidia NVreg_TemporaryFilePath=/var/tmp
