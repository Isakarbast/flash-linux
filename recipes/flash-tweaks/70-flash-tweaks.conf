# Flash Linux: desktop and gaming settings, mostly from CachyOS-Settings.
# Change one in /etc/sysctl.d/ (a file there with the same name replaces this one).

# Memory: zram swap (flash-tweaks service) is fast, so use it readily, keep
# the file cache longer, and start writing dirty pages sooner and in smaller
# batches so big copies don't stall the desktop.
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3
vm.page-cluster = 0
# Some games (CS2, Star Citizen, DayZ) need many memory maps (SteamOS's value).
vm.max_map_count = 2147483642

# No NMI watchdog: it wakes every CPU regularly and can cost a little performance.
kernel.nmi_watchdog = 0
# Don't flood the console with kernel messages; hide kernel addresses from users.
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2
# Split-lock detection slows down some older games a lot; just warn instead.
kernel.split_lock_mitigate = 0

# Network: BBR (the kernel's default here) with fair queueing; a longer
# backlog for fast connections.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.netdev_max_backlog = 4096

fs.file-max = 2097152
