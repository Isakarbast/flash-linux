# Boot menu of the Flash Linux live ISO (UEFI).
set timeout=5
set default=0
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "Flash Linux (live)" {
    linux /boot/vmlinuz live.label=FLASH_LIVE quiet
    initrd /boot/intel-ucode.img /boot/initramfs.img
}

menuentry "Flash Linux (live, safe graphics)" {
    linux /boot/vmlinuz live.label=FLASH_LIVE nomodeset
    initrd /boot/intel-ucode.img /boot/initramfs.img
}

menuentry "UEFI firmware settings" {
    fwsetup
}
